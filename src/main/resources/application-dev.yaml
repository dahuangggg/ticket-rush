server:
  port: ${SERVER_PORT:8081}
  address: ${SERVER_ADDRESS:0.0.0.0}

spring:
  application:
    name: ticket-rush
  web:
    resources:
      cache:
        cachecontrol:
          no-store: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:13306}/${MYSQL_DATABASE:ticket_rush}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=${BUSINESS_ZONE:Asia/Shanghai}&characterEncoding=utf8
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    hikari:
      maximum-pool-size: ${MYSQL_POOL_MAX_SIZE:20}
      minimum-idle: ${MYSQL_POOL_MIN_IDLE:5}
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/dev
    baseline-on-migrate: false
    clean-disabled: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 16
          min-idle: 2
          time-between-eviction-runs: 10s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:ticket-rush}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    listener:
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:3}
    admin:
      auto-create: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: dev.dahuangggg.ticketrush.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

ticket-rush:
  redisson:
    enabled: ${REDISSON_ENABLED:false}
  kafka:
    send-timeout-seconds: ${KAFKA_SEND_TIMEOUT_SECONDS:3}
    topic-replication-factor: ${KAFKA_TOPIC_REPLICATION_FACTOR:1}
    rush-topic-partitions: ${KAFKA_RUSH_TOPIC_PARTITIONS:12}
    cache-topic-partitions: ${KAFKA_CACHE_TOPIC_PARTITIONS:3}
  cache:
    redis-enabled: ${CACHE_REDIS_ENABLED:true}
    hot-detect-threshold: ${HOT_DETECT_THRESHOLD:1000}
    access-count-window-seconds: ${ACCESS_COUNT_WINDOW_SECONDS:60}
    hot-detect-sample-every: ${HOT_DETECT_SAMPLE_EVERY:10}
    hot-detect-max-tracked-events: ${HOT_DETECT_MAX_TRACKED_EVENTS:10000}
    hot-detect-flush-interval-ms: ${HOT_DETECT_FLUSH_INTERVAL_MS:1000}
  auth:
    sms-code-ttl: ${SMS_CODE_TTL:5m}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:14d}
  jwt:
    issuer: ${JWT_ISSUER:ticket-rush}
    secret: ${JWT_SECRET}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:2h}
  observability:
    metrics-enabled: ${METRICS_ENABLED:true}
