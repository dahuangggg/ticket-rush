spring:
  application:
    name: ticket-rush

ticket-rush:
  ai:
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-5.4}
      timeout: ${OPENAI_TIMEOUT:30s}
    chat:
      memory-max-messages: ${AI_CHAT_MEMORY_MAX_MESSAGES:20}
      memory-ttl: ${AI_CHAT_MEMORY_TTL:7d}

  business-zone: ${BUSINESS_ZONE:Asia/Shanghai}
  reminder:
    scan-interval-ms: ${REMINDER_SCAN_INTERVAL_MS:10000}
    compensate-interval-ms: ${REMINDER_COMPENSATE_INTERVAL_MS:60000}
    max-pending-per-user: ${REMINDER_MAX_PENDING_PER_USER:20}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis,kafka
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    description: Concert ticket reservation teaching platform
